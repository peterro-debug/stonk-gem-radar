name: Bootstrap Stonk Gem Radar

on:
  push:
    paths:
      - "stonk-gem-radar.zip"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expand project
        run: |
          rm -rf .bootstrap
          mkdir .bootstrap
          unzip -o stonk-gem-radar.zip -d .bootstrap
          cp -a .bootstrap/. .
          rm -rf .bootstrap stonk-gem-radar.zip .github/workflows/bootstrap.yml

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Bootstrap Stonk Gem Radar"
            git push
          fi
