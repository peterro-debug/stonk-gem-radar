name: Stonk pair history read check
on:
  push:
    branches: [diagnostics/ftx-pair-verification-20260920]
    paths: [.github/workflows/pair-history-readcheck-20260921.yml]
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read Stonk registry and earliest catalogue launches
        run: |
          node <<'NODE'
          const B='https://www.stonkfun.xyz/api/public/v1';
          const G='https://api.github.com/repos/peterro-debug/stonk-gem-radar';
          const FTT='EzfgjvkSwthhgHaceR3LnKXUoRkP6NUhfghdaHAj1tUv';
          const emit=(label,value)=>console.log(label+'='+JSON.stringify(value));
          async function get(url){try{const r=await fetch(url,{headers:{accept:'application/json','cache-control':'no-cache'},signal:AbortSignal.timeout(15000)});const text=await r.text();let b;try{b=JSON.parse(text)}catch{b={nonJson:true,preview:text.slice(0,140)}}return {url,http:r.status,observedAt:new Date().toISOString(),cacheAge:r.headers.get('age'),generatedAt:b.meta?.generatedAt,data:b.data??b};}catch(e){return {url,error:String(e)}}}
          const slim=t=>({mint:t.mint,name:t.name,symbol:t.symbol,quote:t.quote,createdAt:t.createdAt,graduatedAt:t.graduatedAt,status:t.status,launchpad:t.launchpad,pool:t.pool});
          (async()=>{
            const registry=await get(B+'/pairs'); const pairs=registry.data?.pairs;
            const selected=Array.isArray(pairs)?pairs.filter(p=>p.mint===FTT||p.mint==='PEPEqnuuCDbBC89p1u9vpnP1KQ2oj1xTcQBsjt9X55m'||/jeanphil/i.test((p.name||'')+' '+(p.symbol||''))):[];
            emit('REGISTRY',{...registry,data:{count:pairs?.length,selected}});
            const h=await get('https://stonk-gem-radar.vercel.app/api/health');const s=h.data?.sources||{};
            emit('CURRENT_FTT_WATCH',{...h,data:{revision:h.data?.revision,pairMonitor:s.pairMonitor,outdated:s.pairMonitorDeploymentOutdated,ftt:s.fttActivationWatch,launch:s.fttLaunchWatch,registryLastSuccessAt:s.registryLastSuccessAt}});
            for(const pair of selected){
              const m=encodeURIComponent(pair.mint);
              const p=await get(B+'/launchlab/pricing?quoteMint='+m);
              emit('CURRENT_PRICING',{symbol:pair.symbol,...p,data:{quote:p.data?.quote,configId:p.data?.curve?.configId,error:p.data?.error}});
              const newest=await get(B+'/tokens?quoteMint='+m+'&sort=newest&page=1&pageSize=100');
              const total=newest.data?.pagination?.total;
              if(newest.http!==200||!Number.isFinite(total)){emit('CATALOGUE_FAILURE',{symbol:pair.symbol,...newest});continue;}
              const pages=Math.max(1,Math.ceil(total/100));
              const last=pages>1?await get(B+'/tokens?quoteMint='+m+'&sort=newest&page='+pages+'&pageSize=100'):newest;
              let rows=Array.isArray(last.data?.tokens)?last.data.tokens:[];
              if(pages>1&&rows.length<5){const prev=await get(B+'/tokens?quoteMint='+m+'&sort=newest&page='+(pages-1)+'&pageSize=100');rows=rows.concat(prev.data?.tokens||[]);}
              const earliest=rows.filter(t=>t.quote?.mint===pair.mint).sort((a,b)=>Date.parse(a.createdAt)-Date.parse(b.createdAt)).slice(0,6);
              emit('EARLIEST_CATALOGUE_ROWS',{symbol:pair.symbol,quoteMint:pair.mint,total,lastPage:pages,http:last.http,observedAt:last.observedAt,generatedAt:last.generatedAt,cacheAge:last.cacheAge,allReturnedMatchQuote:rows.every(t=>t.quote?.mint===pair.mint),rows:earliest.map(slim)});
              for(const t of earliest.slice(0,3)){
                const detail=await get(B+'/tokens/'+t.mint);const d=detail.data;
                emit('EARLIEST_TOKEN_DETAIL',{symbol:pair.symbol,...detail,data:d?.token?{token:slim(d.token),launch:d.launch}:d});
              }
            }
            const runs=await get(G+'/actions/runs?created=2026-09-20T12%3A00%3A00Z..2026-09-20T19%3A00%3A00Z&per_page=50');
            emit('HISTORICAL_DIAGNOSTIC_RUN_INDEX',{http:runs.http,total:runs.data?.total_count,runs:runs.data?.workflow_runs?.map(r=>({id:r.id,name:r.name,createdAt:r.created_at,head:r.head_sha,path:r.path,conclusion:r.conclusion}))});
            const commits=await get(G+'/commits?since=2026-09-20T12%3A00%3A00Z&until=2026-09-20T19%3A00%3A00Z&per_page=100');
            emit('HISTORICAL_COMMIT_INDEX',{http:commits.http,commits:Array.isArray(commits.data)?commits.data.map(c=>({sha:c.sha,time:c.commit?.committer?.date,message:c.commit?.message})):commits.data});
            emit('SCOPE','Only public HTTP GET reads. No production bot changes, admin secrets, Telegram delivery, trading, signing or launch preparation. First catalogue token createdAt is not a quote-activation timestamp; historical readiness requires independent before-and-after snapshots.');
          })().catch(e=>{emit('ERROR',String(e));process.exitCode=1});
          NODE
