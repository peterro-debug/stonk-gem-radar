name: Verify FTT child pools independently
on:
  push:
    branches: [diagnostics/ftx-pair-verification-20260920]
    paths: [.github/workflows/ftt-independent-pool-check.yml]
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare exact child identities, real pool accounts and vaults
        shell: bash
        run: |
          node <<'NODE'
          const {createHash}=require('node:crypto');
          const B='https://www.stonkfun.xyz/api/public/v1', M='EzfgjvkSwthhgHaceR3LnKXUoRkP6NUhfghdaHAj1tUv';
          const CPMM='CPMMoo8L3F4NbTegBCKVNunggL7H1ZpdTHKxQB5qKP1C';
          const cases=[
            {symbol:'STX',mint:'8rq59Z7rjezyuJpEYBCCWG7iEdEuL6EevpUfMoqbcBQ5',pool:'464iJip1fGczMYgCjVGZ7D5dYEbUApgdzkzN6bt5jwWt'},
            {symbol:'FRIED',mint:'8DCYx1LvF5Pcb8YsR83VDkSBbHZfT47Z9n74pA1VZZwZ',pool:'AExNh1GHDubKy3aMKzFCUa4soFdDzsGnyisSvg7bhQMg'},
            {symbol:'FTT-meme',mint:'4Rqn7bPaq4fq4HhSJMWRScAWXF4jMukZb31trpT2fZyT',pool:'A6YzVNPGgubJP7d9cJkxAgzMYeuwBt5iSwdzLyLmJrWQ'},
            {symbol:'FTX2.0',mint:'GsK7Ssy6UfTkkerHTdcSBtZA72Uixn9E8AGqAoeNKnKL',pool:'EtQPjERg5eXj7iSH4Cp2xyvNMNufqr6iDqu3jMojfxcr'}];
          const emit=(label,value)=>console.log(label+'='+JSON.stringify(value));
          async function read(url,init){try{const r=await fetch(url,{...init,headers:{accept:'application/json',...(init?.headers||{})},signal:AbortSignal.timeout(15000)});const text=await r.text();let b;try{b=JSON.parse(text)}catch{b={nonJsonPreview:text.slice(0,160)}}return {url,http:r.status,observedAt:new Date().toISOString(),cacheAge:r.headers.get('age'),meta:b.meta,data:b.data??b}}catch(e){return {url,error:String(e)}}}
          const rpc=(method,params)=>read('https://api.mainnet-beta.solana.com',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});
          function b58(bytes){const chars='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';let n=BigInt('0x'+bytes.toString('hex')),s='';while(n>0n){s=chars[Number(n%58n)]+s;n/=58n}for(const x of bytes){if(x!==0)break;s='1'+s}return s;}
          async function run(){
            for(const c of cases){
              emit('STONK_CHILD_DETAIL',{case:c,...await read(B+'/tokens/'+c.mint)});
              const dex=await read('https://api.dexscreener.com/latest/dex/pairs/solana/'+c.pool);
              if(Array.isArray(dex.data?.pairs))dex.data={pairs:dex.data.pairs.map(p=>({pairAddress:p.pairAddress,dexId:p.dexId,baseToken:p.baseToken,quoteToken:p.quoteToken,priceUsd:p.priceUsd,marketCap:p.marketCap,fdv:p.fdv,liquidity:p.liquidity,volume:p.volume,txns:p.txns,pairCreatedAt:p.pairCreatedAt,info:p.info}))};
              emit('DEX_CHILD',{case:c,...dex});
            }
            for(const c of cases.slice(0,2))emit('STONK_EXACT_MINT_SEARCH',{case:c,...await read(B+'/tokens?q='+c.mint+'&sort=newest&page=1&pageSize=3')});
            emit('STONK_FTT_FILTER_RECHECK',await read(B+'/tokens?quoteMint='+M+'&sort=newest&page=1&pageSize=5'));
            const accounts=await rpc('getMultipleAccounts',[cases.map(c=>c.pool),{encoding:'base64',commitment:'confirmed'}]);
            const decoded=[];const discriminator=createHash('sha256').update('account:PoolState').digest().subarray(0,8);
            if(Array.isArray(accounts.data?.result?.value))for(let i=0;i<cases.length;i++){
              const a=accounts.data.result.value[i];if(!a){decoded.push({...cases[i],exists:false});continue;}
              const bytes=Buffer.from(a.data[0],'base64');
              if(a.owner!==CPMM||bytes.length<389||!bytes.subarray(0,8).equals(discriminator)){decoded.push({...cases[i],owner:a.owner,decodeError:'Unexpected program, size or discriminator'});continue;}
              const pub=offset=>b58(bytes.subarray(offset,offset+32));
              decoded.push({...cases[i],owner:a.owner,accountSize:bytes.length,discriminatorValidated:true,poolCreator:pub(40),vault0:pub(72),vault1:pub(104),mint0:pub(168),mint1:pub(200),status:bytes[329],swapEnabled:(bytes[329]&4)===0,openTime:Number(bytes.readBigUInt64LE(373)),containsExactFtt:pub(168)===M||pub(200)===M});
            }
            emit('RPC_DECODED_CPMM_POOLS',{http:accounts.http,observedAt:accounts.observedAt,slot:accounts.data?.result?.context?.slot,error:accounts.data?.error,pools:decoded,layoutSource:'raydium-io/raydium-cp-swap/programs/cp-swap/src/states/pool.rs',layoutBlob:'01a9b9faf7f9d13919dac11e2b4ce0b30ad075a0'});
            const vaults=decoded.filter(p=>p.vault0).flatMap(p=>[p.vault0,p.vault1]);
            if(vaults.length){const r=await rpc('getMultipleAccounts',[vaults,{encoding:'jsonParsed',commitment:'confirmed'}]);emit('RPC_POOL_VAULTS',{http:r.http,observedAt:r.observedAt,slot:r.data?.result?.context?.slot,error:r.data?.error,vaults:r.data?.result?.value?.map((a,i)=>({address:vaults[i],owner:a?.owner,info:a?.data?.parsed?.info}))});}
            const sigs=await rpc('getSignaturesForAddress',[cases[0].pool,{limit:2,commitment:'confirmed'}]);emit('RPC_STX_RECENT_SIGNATURES',sigs);
            const sig=sigs.data?.result?.find(s=>s.err===null)?.signature;
            if(sig){const tx=await rpc('getTransaction',[sig,{encoding:'jsonParsed',maxSupportedTransactionVersion:0,commitment:'confirmed'}]);const t=tx.data?.result;emit('RPC_STX_TRANSACTION',{signature:sig,http:tx.http,observedAt:tx.observedAt,error:tx.data?.error,transaction:t?{blockTime:t.blockTime,slot:t.slot,err:t.meta?.err,logMessages:t.meta?.logMessages?.filter(s=>/Instruction:|Swap|swap/i.test(s)),preTokenBalances:t.meta?.preTokenBalances,postTokenBalances:t.meta?.postTokenBalances}:null});}
            emit('SCOPE','Public read-only diagnostic. No bot code/configuration or Telegram messages changed. No token is security-approved. CPMM openTime is trading-open configuration, not a guaranteed original token launch timestamp.');
          }
          run().catch(e=>{emit('FATAL',String(e));process.exitCode=1;});
          NODE
