name: Verify FTT production runtime
on:
  push:
    branches: [diagnostics/ftx-pair-verification-20260920]
    paths: [.github/workflows/ftt-runtime-verification.yml]
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Wait for the existing production watchdog to load the tested revision
        shell: bash
        run: |
          node <<'NODE'
          const expected='959601b27dfe63481112b6bd6148fdcb401f26d1';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{for(let n=0;n<42;n++){
            try{
              const r=await fetch('https://stonk-gem-radar.vercel.app/api/health',{signal:AbortSignal.timeout(15000),headers:{accept:'application/json','cache-control':'no-cache'}});
              if(!r.ok) throw new Error('Health HTTP '+r.status);
              const b=await r.json(),s=b.sources||{},w=s.fttActivationWatch;
              const out={observedAt:new Date().toISOString(),revision:b.revision,pairMonitor:s.pairMonitor,deploymentOutdated:s.pairMonitorDeploymentOutdated,checkedAt:s.checkedAt,fttWatch:w,firstLaunches:s.fttLaunchWatch?.ranked,launchNotifications:s.fttLaunchWatch?.notifiedMints,pairLaunchesLastSuccessAt:s.pairLaunchesLastSuccessAt,pairLaunchesError:s.pairLaunchesError,notificationError:s.notificationError,telegram:b.configured?.telegram,telegramChatId:b.configured?.telegramChatId};
              const good=b.revision===expected&&s.pairMonitor==='active'&&s.pairMonitorDeploymentOutdated===false&&Number.isFinite(w?.checkedAt)&&Date.now()-w.checkedAt<300000&&w.status!=='waiting'&&Boolean(s.fttLaunchWatch)&&b.configured?.telegram===true&&b.configured?.telegramChatId===true;
              if(good){console.log('FTT_RUNTIME_CONFIRMED='+JSON.stringify(out));return;}
              if(n%3===0)console.log('FTT_RUNTIME_WAIT='+JSON.stringify(out));
            }catch(e){if(n%3===0)console.log('FTT_RUNTIME_READ_ERROR='+String(e));}
            await sleep(10000);
          }throw new Error('New FTT runtime not confirmed within verification window');})().catch(e=>{console.error(String(e));process.exitCode=1;});
          NODE
