name: FTX compact diagnostic
on:
  push:
    branches: [diagnostics/ftx-pair-verification-20260920]
    paths: [.github/workflows/ftx-compact-diagnostic.yml]
permissions: {}
jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare FTT pricing with established quotes
        run: |
          node <<'NODE'
          const B='https://www.stonkfun.xyz/api/public/v1';
          const quotes={FTT:'EzfgjvkSwthhgHaceR3LnKXUoRkP6NUhfghdaHAj1tUv',SOL:'So11111111111111111111111111111111111111112',PEPE:'PEPEqnuuCDbBC89p1u9vpnP1KQ2oj1xTcQBsjt9X55m'};
          (async()=>{for(const [symbol,mint] of Object.entries(quotes)){const url=B+'/launchlab/pricing?quoteMint='+mint;try{const r=await fetch(url,{signal:AbortSignal.timeout(20000)});const b=await r.json(),d=b.data??b;console.log('PRICING_CONTROL='+JSON.stringify({symbol,mint,url,observedAt:new Date().toISOString(),http:r.status,keys:Object.keys(d),error:d.error,quote:d.quote,raise:d.raise,curve:d.curve,platform:d.platform}));}catch(e){console.log('PRICING_CONTROL='+JSON.stringify({symbol,url,error:String(e)}));}}const r=await fetch(B+'/tokens?quoteMint='+quotes.FTT+'&sort=newest&page=1&pageSize=3',{signal:AbortSignal.timeout(20000)});console.log('FTT_LAUNCH_RECHECK='+JSON.stringify({observedAt:new Date().toISOString(),http:r.status,body:await r.json()}));})().catch(console.error);
          NODE
