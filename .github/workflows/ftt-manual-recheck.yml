name: Manual FTT public-data recheck
on:
  push:
    branches: [diagnostics/ftx-pair-verification-20260920]
    paths: [.github/workflows/ftt-manual-recheck.yml]
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read public FTT sources without changing the bot or sending transactions
        shell: bash
        run: |
          node <<'NODE'
          const M='EzfgjvkSwthhgHaceR3LnKXUoRkP6NUhfghdaHAj1tUv';
          const B='https://www.stonkfun.xyz/api/public/v1';
          const emit=(label,value)=>console.log(label+'='+JSON.stringify(value));
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function read(url,init){
            try{
              let r=await fetch(url,{...init,headers:{accept:'application/json',...(init?.headers||{})},signal:AbortSignal.timeout(18000)});
              if(r.status===429){await sleep(Math.min(8000,Math.max(1000,Number(r.headers.get('retry-after')||2)*1000)));r=await fetch(url,{...init,headers:{accept:'application/json',...(init?.headers||{})},signal:AbortSignal.timeout(18000)});}
              const text=await r.text();let body;try{body=JSON.parse(text);}catch{body={nonJsonPreview:text.slice(0,160)};}
              return {url,http:r.status,observedAt:new Date().toISOString(),responseDate:r.headers.get('date'),cacheAge:r.headers.get('age'),meta:body.meta,data:body.data??body};
            }catch(e){return {url,observedAt:new Date().toISOString(),error:String(e)};}
          }
          function token(t){return {mint:t.mint,name:t.name,symbol:t.symbol,quote:t.quote,pool:t.pool,launchpad:t.launchpad,mode:t.mode,createdAt:t.createdAt,graduatedAt:t.graduatedAt,status:t.status,market:t.market,launch:t.launch,launchRecord:t.launchRecord};}
          async function run(){
            const [reg,stats,ftt,pepe,sol,health]=await Promise.all([
              read(B+'/pairs'),read(B+'/stats'),read(B+'/launchlab/pricing?quoteMint='+M),
              read(B+'/launchlab/pricing?quoteMint=PEPEqnuuCDbBC89p1u9vpnP1KQ2oj1xTcQBsjt9X55m'),
              read(B+'/launchlab/pricing?quoteMint=So11111111111111111111111111111111111111112'),
              read('https://stonk-gem-radar.vercel.app/api/health')]);
            const pairs=reg.data?.pairs;
            emit('REGISTRY',{...reg,data:Array.isArray(pairs)?{count:pairs.length,pagination:reg.data.pagination,categories:pairs.reduce((a,p)=>(a[p.category||'unknown']=(a[p.category||'unknown']||0)+1,a),{}),matches:pairs.filter(p=>p.mint===M||/\b(ftx|ftt)\b/i.test((p.name||'')+' '+(p.symbol||''))),pepe:pairs.find(p=>p.mint==='PEPEqnuuCDbBC89p1u9vpnP1KQ2oj1xTcQBsjt9X55m')}:reg.data});
            emit('PLATFORM',{...stats,data:{config:stats.data?.config}});
            emit('FTT_PRICING',ftt);emit('PEPE_PRICING',pepe);emit('SOL_PRICING',sol);
            const h=health.data||{},s=h.sources||{};
            emit('BOT_HEALTH',{...health,data:{revision:h.revision,pairMonitor:s.pairMonitor,outdated:s.pairMonitorDeploymentOutdated,checkedAt:s.checkedAt,ftt:s.fttActivationWatch,fttLaunch:s.fttLaunchWatch,registryError:s.registryError,pairLaunchesError:s.pairLaunchesError,pairLaunchesLastSuccessAt:s.pairLaunchesLastSuccessAt,notificationError:s.notificationError,telegramConfigured:h.configured?.telegram}});
            for(const [label,path] of [['FTT_LAUNCHES','/tokens?quoteMint='+M+'&sort=newest&page=1&pageSize=5'],['PEPE_LAUNCHES','/tokens?quoteMint=PEPEqnuuCDbBC89p1u9vpnP1KQ2oj1xTcQBsjt9X55m&sort=newest&page=1&pageSize=3'],['FTX_NAME_SEARCH','/tokens?q=FTX&sort=newest&page=1&pageSize=3']]){
              const r=await read(B+path);emit(label,{...r,data:Array.isArray(r.data?.tokens)?{pagination:r.data.pagination,tokens:r.data.tokens.map(token)}:r.data});
            }
            for(const mint of ['8fogMoMGVZUwtoCB2ZrMkBhq76BzBNw4o2syZCYEvCZG','HQimaBGnHhFqxE1QHsxYGyupshrtPUDA24xZVVZPrdrB']){
              const r=await read(B+'/tokens/'+mint);emit('PREVIOUSLY_MENTIONED_TOKEN',{...r,data:r.data?.token?{token:token(r.data.token),launch:r.data.launch}:r.data?.mint?token(r.data):r.data});
            }
            const urls=[
              ['DEX_FTT_POOLS','https://api.dexscreener.com/token-pairs/v1/solana/'+M],
              ['RAY_FTT_POOLS','https://api-v3.raydium.io/pools/info/mint?mint1='+M+'&poolType=all&poolSortField=liquidity&sortType=desc&pageSize=10&page=1'],
              ['RAY_FTT_PRICE','https://api-v3.raydium.io/mint/price?mints='+M]
            ];
            await Promise.all(urls.map(async([label,url])=>{const r=await read(url);if(label==='DEX_FTT_POOLS'&&Array.isArray(r.data))r.data={count:r.data.length,pairs:r.data.slice(0,10).map(p=>({dexId:p.dexId,url:p.url,pairAddress:p.pairAddress,baseToken:p.baseToken,quoteToken:p.quoteToken,liquidity:p.liquidity,volume:p.volume,txns:p.txns,priceUsd:p.priceUsd,pairCreatedAt:p.pairCreatedAt}))};if(label==='RAY_FTT_POOLS'&&Array.isArray(r.data?.data))r.data={count:r.data.count,hasNextPage:r.data.hasNextPage,pools:r.data.data.map(p=>({id:p.id,type:p.type,programId:p.programId,mintA:p.mintA,mintB:p.mintB,tvl:p.tvl,day:p.day,openTime:p.openTime}))};emit(label,r);}));
            for(const [method,params] of [['getAccountInfo',[M,{encoding:'jsonParsed',commitment:'confirmed'}]],['getSignaturesForAddress',[M,{limit:5,commitment:'confirmed'}]]]){
              emit('RPC_'+method,await read('https://api.mainnet-beta.solana.com',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})}));
            }
            emit('FTT_PRICING_RECHECK',await read(B+'/launchlab/pricing?quoteMint='+M));
            emit('SCOPE','Manual snapshot only. Public unauthenticated GET requests and read-only Solana RPC. No private keys, no signed or submitted transactions, no Telegram messages, no production bot changes. API failure means unknown, not zero activity. Pool catalogue coverage is not a complete on-chain census.');
          }
          run().catch(e=>{emit('FATAL',String(e));process.exitCode=1;});
          NODE
