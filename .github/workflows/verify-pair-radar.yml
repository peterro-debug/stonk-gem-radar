name: Verify Stonk pair radar

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Live historical pair smoke test
        shell: bash
        run: |
          node <<'NODE'
          const cases = [
            {
              label: "PEPE",
              mint: "PEPEqnuuCDbBC89p1u9vpnP1KQ2oj1xTcQBsjt9X55m",
              findMint: "HgcxVs6kJhPAaGqnPNGaa7zYgNT49hJrLufiqcNMuYZT",
              findLabel: "FEELSGOOD",
            },
            {
              label: "BLACKBERRY",
              mint: "BBosJLw8ZzoATiEyywiifx7AgmrD2Cm3XjFWbhbRhChy",
            },
          ];

          const base = "https://www.stonkfun.xyz/api/public/v1";
          async function page(quoteMint, pageNo) {
            const u = new URL(base + "/tokens");
            u.searchParams.set("quoteMint", quoteMint);
            u.searchParams.set("sort", "newest");
            u.searchParams.set("page", String(pageNo));
            u.searchParams.set("pageSize", "100");
            const res = await fetch(u, { headers: { accept: "application/json" } });
            if (!res.ok) throw new Error(`${quoteMint}: HTTP ${res.status}`);
            const body = await res.json();
            const rows = body?.data?.tokens;
            if (!Array.isArray(rows)) throw new Error(`${quoteMint}: invalid token feed`);
            return { rows, total: Number(body?.data?.pagination?.total ?? rows.length) };
          }

          for (const c of cases) {
            const p1 = await page(c.mint, 1);
            const pageCount = Math.max(1, Math.ceil(p1.total / 100));
            const pages = [p1];
            for (let p = 2; p <= pageCount; p++) pages.push(await page(c.mint, p));
            const rows = [...new Map(pages.flatMap(p => p.rows).map(r => [r.mint, r])).values()]
              .filter(r => r?.mint && Number.isFinite(Date.parse(r.createdAt || "")))
              .sort((a,b) => Date.parse(a.createdAt) - Date.parse(b.createdAt) || a.mint.localeCompare(b.mint));
            if (rows.length < 3) throw new Error(`${c.label}: fewer than 3 historical launches found`);
            if (!rows.every(r => r.quote?.mint === c.mint)) throw new Error(`${c.label}: quoteMint mismatch`);
            const firstThree = rows.slice(0, 3);
            const targetIndex = c.findMint ? rows.findIndex(r => r.mint === c.findMint) : -1;
            console.log(JSON.stringify({
              label: c.label,
              total: p1.total,
              firstThree: firstThree.map((r,i) => ({rank:i+1,mint:r.mint,name:r.name,symbol:r.symbol,createdAt:r.createdAt})),
              ...(c.findMint ? {
                target: c.findLabel,
                targetRankByCreatedAtThenMint: targetIndex >= 0 ? targetIndex + 1 : null,
                targetRow: targetIndex >= 0 ? rows[targetIndex] : null,
              } : {}),
            }, null, 2));
            if (c.findMint && targetIndex < 0) throw new Error(`${c.label}: ${c.findLabel} mint not found in complete quote feed`);
          }
          NODE
      - name: Production watchdog smoke test
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            body="$(curl -fsS --max-time 15 https://stonk-gem-radar.vercel.app/api/health || true)"
            if [ -n "$body" ]; then
              export BODY="$body"
              export EXPECTED_SHA="$GITHUB_SHA"
              if node -e '
                const body = JSON.parse(process.env.BODY);
                const s = body.sources || {};
                const ok = body.revision === process.env.EXPECTED_SHA
                  && s.pairMonitor === "active"
                  && s.pairMonitorDeploymentOutdated === false
                  && Number.isFinite(s.pairLaunchesLastSuccessAt)
                  && !s.pairLaunchesError
                  && Number.isFinite(s.launchesLastSuccessAt)
                  && !s.launchesError;
                if (!ok) {
                  console.log(JSON.stringify({
                    revision: body.revision,
                    expectedRevision: process.env.EXPECTED_SHA,
                    pairMonitor: s.pairMonitor,
                    deploymentOutdated: s.pairMonitorDeploymentOutdated,
                    pairLaunchesLastSuccessAt: s.pairLaunchesLastSuccessAt,
                    pairLaunchesError: s.pairLaunchesError,
                    launchesLastSuccessAt: s.launchesLastSuccessAt,
                    launchesError: s.launchesError,
                  }, null, 2));
                  process.exit(1);
                }
                console.log("Production monitor is active on this revision; pair-specific and global launch feeds are healthy.");
              '; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Production monitor did not become healthy on the deployed revision in time." >&2
          exit 1
