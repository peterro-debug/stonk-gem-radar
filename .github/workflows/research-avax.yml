name: Research AVAX Stonk launches
on: [push]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check AVAX-native naming saturation
        shell: bash
        run: |
          node <<'NODE'
          const BASE="https://www.stonkfun.xyz/api/public/v1";
          const get=async u=>{const r=await fetch(u,{headers:{accept:"application/json"}});if(!r.ok)throw new Error(r.status+" "+u);return r.json()};
          const pairs=(await get(BASE+"/pairs"))?.data?.pairs||[];
          const q=pairs.find(x=>x.symbol==="AVAX"||x.name==="Avalanche");
          if(!q) throw new Error("no AVAX");
          const first=await get(BASE+`/tokens?quoteMint=${q.mint}&sort=newest&page=1&pageSize=100`);
          const total=Number(first?.data?.pagination?.total||0), pc=Math.ceil(total/100);
          let all=[...(first?.data?.tokens||[])];
          for(let p=2;p<=pc;p++){const b=await get(BASE+`/tokens?quoteMint=${q.mint}&sort=newest&page=${p}&pageSize=100`);all.push(...(b?.data?.tokens||[]))}
          all=[...new Map(all.map(x=>[x.mint,x])).values()];
          const themes=["snowman","snow","coq","chikn","kimbo","red","triangle","dorito","joe","wolf","avax","avalanche","subnet","blizzard","frost","ice","no chill","nochill","gecko","penguin"];
          for(const t of themes){
            const m=all.filter(x=>[x.name,x.symbol].filter(Boolean).join(" ").toLowerCase().includes(t));
            console.log("THEME",t,"COUNT",m.length,JSON.stringify(m.slice(0,20).map(x=>({name:x.name,symbol:x.symbol,mint:x.mint,mc:x.market?.marketCapUsd,peak:x.market?.peakMarketCapUsd,vol:x.market?.volume24hUsd,status:x.status,createdAt:x.createdAt}))));
          }
          NODE
