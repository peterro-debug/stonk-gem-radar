name: AVAX quick trade scan
on: [push]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Quick AVAX candidates
        shell: bash
        run: |
          node <<'NODE'
          const BASE="https://www.stonkfun.xyz/api/public/v1";
          const get=async u=>{const r=await fetch(u,{headers:{accept:"application/json"}});if(!r.ok)throw new Error(r.status+" "+u);return r.json()};
          const pairs=(await get(BASE+"/pairs"))?.data?.pairs||[];
          const q=pairs.find(x=>x.symbol==="AVAX"||x.name==="Avalanche");
          if(!q) throw new Error("AVAX quote not found");
          const sorts=["marketCap","volume","newest"];
          let rows=[];
          for(const sort of sorts){
            const b=await get(BASE+`/tokens?quoteMint=${encodeURIComponent(q.mint)}&sort=${sort}&page=1&pageSize=100`);
            rows.push(...(b?.data?.tokens||[]));
          }
          rows=[...new Map(rows.map(x=>[x.mint,x])).values()];
          const n=(x,k)=>Number(x?.market?.[k]||0);
          const ageMin=x=>(Date.now()-Date.parse(x.createdAt||0))/60000;
          const data=rows.map(x=>{
            const mc=n(x,"marketCapUsd"),peak=n(x,"peakMarketCapUsd"),vol=n(x,"volume24hUsd"),liq=n(x,"liquidityUsd");
            const ret=peak>0?mc/peak:0;
            const score =
              (x.status==="graduated"?3:0)
              + Math.min(5, Math.log10(Math.max(1,mc))/1.5)
              + Math.min(5, Math.log10(Math.max(1,liq))/1.4)
              + Math.min(5, vol/Math.max(1,mc)*2)
              + Math.min(5, ret*6)
              + (ageMin(x)<60?1.5:0);
            return {name:x.name,symbol:x.symbol,mint:x.mint,createdAt:x.createdAt,status:x.status,mode:x.mode,
              mc:Math.round(mc),peak:Math.round(peak),vol:Math.round(vol),liq:Math.round(liq),
              retention:Number((ret*100).toFixed(1)),ageMin:Number(ageMin(x).toFixed(1)),score:Number(score.toFixed(2))};
          });
          const eligible=data.filter(x=>x.mc>=5000&&x.liq>=3000&&x.vol>=10000);
          console.log("QUICK_TOP",JSON.stringify([...eligible].sort((a,b)=>b.score-a.score).slice(0,12)));
          console.log("NEW_HOT",JSON.stringify([...data].filter(x=>x.ageMin<=45&&x.vol>=5000).sort((a,b)=>b.vol-a.vol).slice(0,10)));
          NODE
