name: Research AVAX Stonk launches
on: [push]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scan live Stonk AVAX pair
        shell: bash
        run: |
          node <<'NODE'
          const BASE = "https://www.stonkfun.xyz/api/public/v1";
          const get = async (u) => {
            const r = await fetch(u, {headers:{accept:"application/json"}});
            if(!r.ok) throw new Error(r.status+" "+u);
            return r.json();
          };
          const pairsBody = await get(BASE + "/pairs");
          const pairs = pairsBody?.data?.pairs || [];
          const matches = pairs.filter(p => /AVAX|Avalanche/i.test([p.name,p.symbol,p.mint,p.category].filter(Boolean).join(" ")));
          console.log("PAIR_MATCHES", JSON.stringify(matches,null,2));
          if(!matches.length) process.exit(2);
          for (const q of matches) {
            const enc = encodeURIComponent(q.mint);
            const byMc = await get(BASE+`/tokens?quoteMint=${enc}&sort=marketCap&page=1&pageSize=100`);
            const byVol = await get(BASE+`/tokens?quoteMint=${enc}&sort=volume&page=1&pageSize=100`);
            const newest = await get(BASE+`/tokens?quoteMint=${enc}&sort=newest&page=1&pageSize=100`);
            const rows = [...new Map([
              ...(byMc?.data?.tokens||[]),
              ...(byVol?.data?.tokens||[]),
              ...(newest?.data?.tokens||[])
            ].map(x=>[x.mint,x])).values()];
            const val=(x,k)=>Number(x?.market?.[k]||0);
            const concise=x=>({
              mint:x.mint,name:x.name,symbol:x.symbol,createdAt:x.createdAt,status:x.status,mode:x.mode,
              marketCapUsd:val(x,"marketCapUsd"),fdvUsd:val(x,"fdvUsd"),volume24hUsd:val(x,"volume24hUsd"),
              liquidityUsd:val(x,"liquidityUsd"),priceChange24h:val(x,"priceChange24h"),
              peakMarketCapUsd:val(x,"peakMarketCapUsd"),graduationProgress:Number(x.graduationProgress||0),
              quote:x.quote
            });
            const topMc=[...rows].sort((a,b)=>val(b,"marketCapUsd")-val(a,"marketCapUsd")).slice(0,15).map(concise);
            const topVol=[...rows].sort((a,b)=>val(b,"volume24hUsd")-val(a,"volume24hUsd")).slice(0,15).map(concise);
            const score=x=>{
              const mc=Math.max(1,val(x,"marketCapUsd"));
              const vol=val(x,"volume24hUsd"), liq=val(x,"liquidityUsd"), peak=val(x,"peakMarketCapUsd");
              const retention=peak>0?val(x,"marketCapUsd")/peak:0;
              return Math.log10(Math.max(1,vol))*3 + Math.log10(Math.max(1,liq))*2 + Math.min(5,vol/mc*5) + retention*4 + (x.status==="graduated"?3:0);
            };
            const traction=[...rows].sort((a,b)=>score(b)-score(a)).slice(0,20).map(x=>({...concise(x),tractionScore:Number(score(x).toFixed(2))}));
            console.log("AVAX_QUOTE", JSON.stringify(q,null,2));
            console.log("TOTAL", byMc?.data?.pagination?.total ?? rows.length);
            console.log("TOP_MARKET_CAP", JSON.stringify(topMc,null,2));
            console.log("TOP_VOLUME", JSON.stringify(topVol,null,2));
            console.log("TOP_TRACTION", JSON.stringify(traction,null,2));
          }
          NODE
