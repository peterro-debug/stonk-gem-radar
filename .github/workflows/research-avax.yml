name: Research AVAX Stonk launches
on: [push]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scan full live Stonk AVAX cohort
        shell: bash
        run: |
          node <<'NODE'
          const BASE="https://www.stonkfun.xyz/api/public/v1";
          const get=async u=>{const r=await fetch(u,{headers:{accept:"application/json"}});if(!r.ok)throw new Error(r.status+" "+u);return r.json()};
          const p=(await get(BASE+"/pairs"))?.data?.pairs||[];
          const q=p.find(x=>x.symbol==="AVAX"||x.name==="Avalanche");
          if(!q) throw new Error("AVAX quote not found");
          const first=await get(BASE+`/tokens?quoteMint=${encodeURIComponent(q.mint)}&sort=newest&page=1&pageSize=100`);
          const total=Number(first?.data?.pagination?.total||0), pages=Math.ceil(total/100);
          const all=[...(first?.data?.tokens||[])];
          for(let page=2;page<=pages;page++){
            const b=await get(BASE+`/tokens?quoteMint=${encodeURIComponent(q.mint)}&sort=newest&page=${page}&pageSize=100`);
            all.push(...(b?.data?.tokens||[]));
          }
          const rows=[...new Map(all.map(x=>[x.mint,x])).values()];
          const n=(x,k)=>Number(x?.market?.[k]||0);
          const compact=x=>({name:x.name,symbol:x.symbol,mint:x.mint,createdAt:x.createdAt,status:x.status,mode:x.mode,
            mc:Math.round(n(x,"marketCapUsd")),peak:Math.round(n(x,"peakMarketCapUsd")),vol:Math.round(n(x,"volume24hUsd")),
            liq:Math.round(n(x,"liquidityUsd")),retention:n(x,"peakMarketCapUsd")?Number((n(x,"marketCapUsd")/n(x,"peakMarketCapUsd")*100).toFixed(1)):null});
          const topPeak=[...rows].sort((a,b)=>n(b,"peakMarketCapUsd")-n(a,"peakMarketCapUsd")).slice(0,20).map(compact);
          const topCurrent=[...rows].sort((a,b)=>n(b,"marketCapUsd")-n(a,"marketCapUsd")).slice(0,20).map(compact);
          const topVolume=[...rows].sort((a,b)=>n(b,"volume24hUsd")-n(a,"volume24hUsd")).slice(0,20).map(compact);
          console.log("AVAX_QUOTE",JSON.stringify(q));
          console.log("TOTAL",rows.length);
          console.log("TOP_PEAK",JSON.stringify(topPeak));
          console.log("TOP_CURRENT",JSON.stringify(topCurrent));
          console.log("TOP_VOLUME",JSON.stringify(topVolume));
          NODE
