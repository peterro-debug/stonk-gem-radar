name: Build and test FTT watch
on:
  push:
    branches: [fix/ftt-activation-watch]
    paths: [.github/workflows/build-ftt-watch.yml]
permissions:
  contents: write
jobs:
  build-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ftt-activation-watch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply narrowly scoped FTT watch changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              assert s.count(old)==count, (path, old, s.count(old))
              p.write_text(s.replace(old,new))
          Path('lib/ftt-watch.ts').write_text(r'''import type { PairLaunchWatch, PairMonitorState } from "./pair-events";
          import type { PairEvent } from "./types";

          export const FTT_MINT = "EzfgjvkSwthhgHaceR3LnKXUoRkP6NUhfghdaHAj1tUv";
          // Last independently captured successful empty Stonk quote-feed snapshot.
          // This is an observation baseline, NOT the quote's creation/activation time.
          export const FTT_EMPTY_BASELINE = Date.parse("2026-09-20T20:29:44.609Z");
          const BASE = "https://www.stonkfun.xyz/api/public/v1";
          export type FttWatch = {
            since: number;
            status: "waiting" | "registry-not-ready" | "pricing-unavailable" | "source-error" | "ready";
            checkedAt?: number;
            pricingHttpStatus?: number;
            launchable?: boolean;
            launchLabReady?: boolean;
            configId?: string;
            error?: string;
            readyDetectedAt?: number;
            notifiedAt?: number;
            deliveryError?: string;
          };
          export function ensureFttWatch(state: PairMonitorState): PairMonitorState {
            const fttWatch = state.fttWatch ?? { since: FTT_EMPTY_BASELINE, status: "waiting" as const };
            const old = state.pairLaunchWatches?.[FTT_MINT];
            return { ...state, fttWatch, pairLaunchWatches: { ...state.pairLaunchWatches,
              [FTT_MINT]: old ?? { eventDetectedAt: fttWatch.since, ranked: [], notifiedMints: {}, cohort: [], momentumNotified: {} },
            } };
          }
          export function fttLaunchEvent(state: PairMonitorState): PairEvent | undefined {
            const watch = state.pairLaunchWatches?.[FTT_MINT];
            if (!state.fttWatch || !watch || watch.ranked.slice(0, 3).filter(r => watch.notifiedMints[r.mint]).length >= 3) return undefined;
            return { quoteMint: FTT_MINT, detectedAt: watch.eventDetectedAt, source: "stonk-registry",
              sourceUrl: `${BASE}/pairs`,
              description: "User-requested persistent FTT watch from a verified empty-feed observation; not a new registry/activation timestamp." };
          }
          export function pairCohortWindowOpen(event: PairEvent, watch: PairLaunchWatch | undefined, now: number, pinnedFtt: boolean): boolean {
            return Boolean(watch && (now - event.detectedAt <= 2 * 60 * 60_000
              || (pinnedFtt && event.quoteMint === FTT_MINT && watch.ranked.length < 3)));
          }
          const address = (v: unknown): v is string => typeof v === "string" && /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(v);
          const positiveRaw = (v: unknown) => typeof v === "string" && /^\d+$/.test(v) && BigInt(v) > 0n;
          export function validFttPricing(p: any): boolean {
            return p?.quote?.mint === FTT_MINT && p.quote.decimals === 8
              && p?.curve?.programId === "LanMV9sAd7wArD4vJFi2qDdfnVhFxYSUg6eADduJ3uj"
              && address(p.curve.configId) && p.curve.curveType === "ConstantCurve" && p.curve.migrateType === "cpmm"
              && positiveRaw(p?.raise?.raw) && positiveRaw(p.curve.supply) && positiveRaw(p.curve.totalSellA)
              && address(p?.platform?.standard) && address(p?.curveRule?.standard);
          }
          export function shouldNotifyFtt(watch: FttWatch): boolean {
            return watch.status === "ready" && watch.readyDetectedAt != null && watch.notifiedAt == null;
          }
          export async function readFttReadiness(previous: FttWatch, fetcher: typeof fetch = fetch, now = Date.now()): Promise<FttWatch> {
            // One readiness notification, persisted across restarts. Child launches
            // keep using the existing shared pair-launch watcher and delivery ledger.
            if (previous.notifiedAt != null) return previous;
            const state: FttWatch = { ...previous, checkedAt: now, error: undefined, pricingHttpStatus: undefined,
              launchable: undefined, launchLabReady: undefined, configId: undefined };
            const base = (process.env.STONKFUN_API_BASE || BASE).replace(/\/$/, "");
            async function get(path: string) {
              const r = await fetcher(base + path, { headers: { accept: "application/json" }, cache: "no-store", signal: AbortSignal.timeout(10_000) });
              const b = await r.json();
              return { http: r.status, data: b?.data ?? b };
            }
            try {
              const [registry, stats, pricing] = await Promise.all([
                get("/pairs"), get("/stats"), get(`/launchlab/pricing?quoteMint=${FTT_MINT}`),
              ]);
              state.pricingHttpStatus = pricing.http;
              if (registry.http !== 200 || stats.http !== 200 || !Array.isArray(registry.data?.pairs)
                || typeof stats.data?.config?.launchLabEnabled !== "boolean") {
                return { ...state, status: "source-error", error: "Registry/platform status could not be verified" };
              }
              const pair = registry.data.pairs.find((p: any) => p.mint === FTT_MINT);
              state.launchable = pair?.launchable;
              state.launchLabReady = pair?.launchLabReady;
              if (pair?.launchable !== true || pair?.launchLabReady !== true || stats.data.config.launchLabEnabled !== true) {
                return { ...state, status: "registry-not-ready" };
              }
              if (pricing.http !== 200 || !validFttPricing(pricing.data)) {
                return { ...state, status: "pricing-unavailable", error: `FTT pricing HTTP ${pricing.http}; valid launch configuration not confirmed` };
              }
              return { ...state, status: "ready", configId: pricing.data.curve.configId,
                readyDetectedAt: previous.readyDetectedAt ?? now };
            } catch {
              return { ...state, status: "source-error", error: "FTT source timed out or returned malformed data; will retry" };
            }
          }
          export function formatFttReady(watch: FttWatch): string {
            return [
              "🟢 STONK — FTT PARING KLAR / PRISING AKTIV",
              "FTX Token (FTT)",
              "Stonk rapporterer launchable=true og launchLabReady=true. FTT-prising og launchkonfigurasjon svarer gyldig.",
              `Quote mint: ${FTT_MINT}`,
              `Først bekreftet av denne vakten: ${new Date(watch.readyDetectedAt!).toISOString()}`,
              "Første faktiske tokenlaunch varsles separat som FTT LAUNCH #1. Vakten utløper ikke etter to timer.",
              "Dette bekrefter API-klarstatus, ikke en gjennomført launchtransaksjon eller et kjøpssignal.",
              `${BASE}/tokens?quoteMint=${FTT_MINT}&sort=newest&page=1&pageSize=100`,
            ].join("\n");
          }
          ''')
          replace('lib/pair-events.ts', 'import { containsPhrase, quoteAliases }', 'import type { FttWatch } from "./ftt-watch";\nimport { containsPhrase, quoteAliases }')
          replace('lib/pair-events.ts', '  version: 1;\n  initializedAt?', '  version: 1;\n  fttWatch?: FttWatch;\n  initializedAt?')
          replace('workflows/pair-monitor.ts', 'const errorText =', 'import { ensureFttWatch, fttLaunchEvent, pairCohortWindowOpen, readFttReadiness, shouldNotifyFtt, formatFttReady, FTT_MINT, type FttWatch } from "@/lib/ftt-watch";\n\nconst errorText =')
          replace('workflows/pair-monitor.ts', '  const now = Date.now();\n  let state:', '  const now = Date.now();\n  if (previous.fttWatch) previous = ensureFttWatch(previous);\n  let state:')
          replace('workflows/pair-monitor.ts', '.filter(([, watch]) => now - watch.eventDetectedAt < EVENT_WINDOW_MS)', '.filter(([mint, watch]) => (Boolean(previous.fttWatch) && mint === FTT_MINT) || now - watch.eventDetectedAt < EVENT_WINDOW_MS)')
          replace('workflows/pair-monitor.ts', '      state.pairLaunchWatches[event.quoteMint] = {', '      if (event.quoteMint === FTT_MINT && state.fttWatch && state.pairLaunchWatches[FTT_MINT]) continue;\n      state.pairLaunchWatches[event.quoteMint] = {')
          replace('workflows/pair-monitor.ts', '  const activePairEvents = [...new Map(', '  const registryPairEvents = [...new Map(')
          replace('workflows/pair-monitor.ts', '  const pairFeeds = await Promise.allSettled(activePairEvents.map(async event => {', '  const pinnedFttEvent = fttLaunchEvent(state);\n  const activePairEvents = pinnedFttEvent\n    ? [pinnedFttEvent, ...registryPairEvents.filter(e => e.quoteMint !== FTT_MINT)].slice(0, 10)\n    : registryPairEvents;\n  const pairFeeds = await Promise.allSettled(activePairEvents.map(async event => {')
          replace('workflows/pair-monitor.ts', 'watch && now - event.detectedAt <= 2 * 60 * 60_000', 'pairCohortWindowOpen(event, watch, now, Boolean(state.fttWatch))', count=2)
          replace('workflows/pair-monitor.ts', 'async function notifyPair(event:', '''async function checkFtt(watch: FttWatch) {
            "use step";
            return readFttReadiness(watch);
          }

          async function notifyFtt(watch: FttWatch) {
            "use step";
            try { await sendTelegram(formatFttReady(watch), FTT_MINT); return true; }
            catch { return false; }
          }

          async function notifyPair(event:''')
          replace('workflows/pair-monitor.ts', '  let state = seed ?? emptyMonitorState();', '  let state = ensureFttWatch(seed ?? emptyMonitorState());')
          replace('workflows/pair-monitor.ts', '      const result = await pollPairSources(state);', '''      // Check/deliver readiness before the heavier global discovery/analysis lane.
                state.fttWatch = await checkFtt(state.fttWatch!);
                if (shouldNotifyFtt(state.fttWatch)) {
                  if (await notifyFtt(state.fttWatch)) {
                    state.fttWatch = { ...state.fttWatch, notifiedAt: Date.now(), deliveryError: undefined };
                  } else {
                    state.fttWatch = { ...state.fttWatch, deliveryError: "Telegram readiness delivery pending; retrying on next confirmed-ready poll" };
                  }
                }
                await checkpoint(state);
                const result = await pollPairSources(state);''')
          replace('workflows/pair-monitor.ts', 'state.notificationError = pending.length || pairLaunchDeliveryFailed || momentumDeliveryFailed', 'state.notificationError = state.fttWatch?.deliveryError || pending.length || pairLaunchDeliveryFailed || momentumDeliveryFailed')
          replace('app/api/health/route.ts', '      checkedAt: monitor.state?.checkedAt,', '      checkedAt: monitor.state?.checkedAt,\n      fttActivationWatch: monitor.state?.fttWatch,\n      fttLaunchWatch: monitor.state?.pairLaunchWatches?.["EzfgjvkSwthhgHaceR3LnKXUoRkP6NUhfghdaHAj1tUv"],')
          Path('tests/ftt-watch.test.ts').write_text(r'''import { describe, expect, it, vi } from "vitest";
          import { emptyMonitorState } from "../lib/pair-events";
          import { ensureFttWatch, fttLaunchEvent, pairCohortWindowOpen, readFttReadiness, shouldNotifyFtt, validFttPricing, formatFttReady, FTT_MINT, FTT_EMPTY_BASELINE, type FttWatch } from "../lib/ftt-watch";

          const valid = () => ({ quote: { mint: FTT_MINT, decimals: 8 }, raise: { raw: "100" },
            curve: { programId: "LanMV9sAd7wArD4vJFi2qDdfnVhFxYSUg6eADduJ3uj", configId: FTT_MINT,
              curveType: "ConstantCurve", migrateType: "cpmm", supply: "1000", totalSellA: "800" },
            platform: { standard: FTT_MINT }, curveRule: { standard: FTT_MINT } });
          const seed = (): FttWatch => ({ since: FTT_EMPTY_BASELINE, status: "waiting" });
          function fake(options: { http?: number; pricing?: any; pair?: any; enabled?: boolean; registryHttp?: number; stats?: any } = {}) {
            return vi.fn(async (input: any) => {
              const url = String(input);
              if (url.endsWith("/pairs")) return { status: options.registryHttp ?? 200,
                json: async () => ({ data: { pairs: [options.pair ?? { mint: FTT_MINT, launchable: true, launchLabReady: true }] } }) };
              if (url.endsWith("/stats")) return { status: 200,
                json: async () => ({ data: options.stats ?? { config: { launchLabEnabled: options.enabled ?? true } } }) };
              return { status: options.http ?? 200, json: async () => ({ data: options.pricing ?? valid() }) };
            }) as unknown as typeof fetch;
          }
          describe("FTT readiness alert", () => {
            it("does not treat the two registry flags plus HTTP503 as activation", async () => {
              const s = await readFttReadiness(seed(), fake({ http: 503 }), 123);
              expect(s.status).toBe("pricing-unavailable"); expect(s.pricingHttpStatus).toBe(503); expect(shouldNotifyFtt(s)).toBe(false);
            });
            it("detects the recovery from 503 to valid pricing", async () => {
              const failed = await readFttReadiness(seed(), fake({ http: 503 }), 123);
              const s = await readFttReadiness(failed, fake(), 124);
              expect(s.status).toBe("ready"); expect(s.readyDetectedAt).toBe(124); expect(shouldNotifyFtt(s)).toBe(true);
            });
            it("alerts when already ready on the first deployment check without inventing an activation timestamp", async () => {
              const s = await readFttReadiness(seed(), fake(), 124);
              expect(s.readyDetectedAt).toBe(124); expect(shouldNotifyFtt(s)).toBe(true);
            });
            it.each([undefined, false, "true"])("requires the readiness boolean, not missing/false/string values: %s", async flag => {
              const s = await readFttReadiness(seed(), fake({ pair: { mint: FTT_MINT, launchable: true, launchLabReady: flag } }), 123);
              expect(shouldNotifyFtt(s)).toBe(false);
            });
            it("requires the platform LaunchLab switch", async () => {
              expect(shouldNotifyFtt(await readFttReadiness(seed(), fake({ enabled: false })))).toBe(false);
            });
            it("never activates against MSFTX, an arbitrary FTX-named token or a wrong pricing mint", async () => {
              const p = valid(); p.quote.mint = "So11111111111111111111111111111111111111112";
              expect(validFttPricing(p)).toBe(false);
              expect(shouldNotifyFtt(await readFttReadiness(seed(), fake({ pair: { mint: "MSFTX", name: "FTX", launchable: true, launchLabReady: true } })))).toBe(false);
            });
            it("rejects empty/malformed pricing, zero raise and missing launch config", () => {
              expect(validFttPricing({})).toBe(false);
              const p = valid(); p.raise.raw = "0"; expect(validFttPricing(p)).toBe(false);
              p.raise.raw = "1"; p.curve.configId = ""; expect(validFttPricing(p)).toBe(false);
            });
            it("does not call a registry HTTP failure an activation", async () => {
              expect((await readFttReadiness(seed(), fake({ registryHttp: 503 }))).status).toBe("source-error");
            });
            it("retains the pending alert until delivery and avoids repeat notifications after restart", async () => {
              const s = await readFttReadiness(seed(), fake(), 124);
              const retry = await readFttReadiness(s, fake(), 125);
              expect(retry.readyDetectedAt).toBe(124); expect(shouldNotifyFtt(retry)).toBe(true);
              const sent = { ...retry, notifiedAt: 126 };
              const never = vi.fn() as unknown as typeof fetch;
              expect(shouldNotifyFtt(await readFttReadiness(sent, never, 127))).toBe(false);
              expect(never).not.toHaveBeenCalled();
            });
            it("does not send a stale pending READY message while pricing is failing again", async () => {
              const ready = await readFttReadiness(seed(), fake(), 124);
              expect(shouldNotifyFtt(await readFttReadiness(ready, fake({ http: 503 }), 125))).toBe(false);
            });
            it("handles network failures without stopping the existing monitor", async () => {
              const fail = vi.fn(async () => { throw new Error("timeout"); }) as unknown as typeof fetch;
              const s = await readFttReadiness(seed(), fail, 123);
              expect(s.status).toBe("source-error"); expect(shouldNotifyFtt(s)).toBe(false);
            });
            it("labels API readiness separately from a completed token launch", async () => {
              const text = formatFttReady(await readFttReadiness(seed(), fake(), 124));
              expect(text).toContain("FTT PARING KLAR"); expect(text).toContain("FTT LAUNCH #1");
              expect(text).toContain("ikke en gjennomført launchtransaksjon"); expect(text).toContain(FTT_MINT);
            });
          });
          describe("FTT persistent first-launch watch", () => {
            it("survives both the two-hour cohort timeout and 48-hour event expiry", () => {
              const state = ensureFttWatch(emptyMonitorState());
              const event = fttLaunchEvent(state)!;
              expect(event.quoteMint).toBe(FTT_MINT);
              expect(pairCohortWindowOpen(event, state.pairLaunchWatches![FTT_MINT], FTT_EMPTY_BASELINE + 7 * 86400_000, true)).toBe(true);
            });
            it("does not extend every other quote or seed independent monitors", () => {
              expect(fttLaunchEvent(emptyMonitorState())).toBeUndefined();
              const state = ensureFttWatch(emptyMonitorState());
              const event = { ...fttLaunchEvent(state)!, quoteMint: "other" };
              expect(pairCohortWindowOpen(event, state.pairLaunchWatches![FTT_MINT], FTT_EMPTY_BASELINE + 3 * 3600_000, true)).toBe(false);
            });
            it("preserves the existing #1/#2/#3 delivery ledger rather than creating duplicates", () => {
              const s = ensureFttWatch(emptyMonitorState());
              const w = s.pairLaunchWatches![FTT_MINT];
              w.ranked = [1,2,3].map(n => ({ mint: String(n), launchedAt: FTT_EMPTY_BASELINE + n }));
              w.notifiedMints = { "1": 1, "2": 2 };
              expect(fttLaunchEvent(ensureFttWatch(s))).toBeDefined();
              w.notifiedMints["3"] = 3;
              expect(fttLaunchEvent(ensureFttWatch(s))).toBeUndefined();
              expect(ensureFttWatch(s).pairLaunchWatches![FTT_MINT]).toBe(w);
            });
          });
          ''')
          Path('docs/ftt-activation-watch.md').write_text('''# FTT activation watch

          Quote: `EzfgjvkSwthhgHaceR3LnKXUoRkP6NUhfghdaHAj1tUv`.

          Runs inside the existing single durable pair monitor, not a separate bot or ChatGPT automation. The monitor sleeps 60 seconds after each full tick; network, discovery, workflow queue and Telegram latency add to that interval. No exact-second delivery guarantee.

          The one-time readiness notification requires exact quote-mint identity, both explicit registry booleans, the global LaunchLab switch, and HTTP 200 with valid quote-specific pricing/curve configuration. It does not claim that a transaction was signed or successfully executed. Source failures are UNKNOWN/unavailable, not activation. Failed Telegram delivery remains pending until a later confirmed-ready check; successful delivery is recorded in durable state.

          The FTT first-launch watch uses the existing #1/#2/#3 rank and notification ledger. It is pinned ahead of the ten ordinary event slots and does not expire at two hours or 48 hours before those launches have been delivered. Its starting timestamp is a verified empty Stonk-feed observation (2026-09-20T20:29:44.609Z), not an invented quote creation time. Normal safety gates, candidate approval and other pair watches are unchanged.

          Public health exposes `sources.fttActivationWatch` and `sources.fttLaunchWatch`. The existing five-minute watchdog moves the running pair monitor to the new deployment while preserving state. Verify the deployed revision, active/non-outdated monitor, and a populated recent FTT check before reporting the watch as running. No Telegram or wallet credentials are logged or changed.
          ''')
          print('PATCH_READY')
          PY
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit only tested application and test files to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add lib/ftt-watch.ts lib/pair-events.ts workflows/pair-monitor.ts app/api/health/route.ts tests/ftt-watch.test.ts docs/ftt-activation-watch.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add verified FTT readiness alert and persistent exact-quote first launches'
          git push origin HEAD:fix/ftt-activation-watch
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
